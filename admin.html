<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173d2b">
<title>MCC ReLoop — Admin</title><link rel="icon" type="image/svg+xml" href="reloop-mark.svg">
<style>
:root{--paper:#f4f2e9;--ink:#17271e;--forest:#173d2b;--forest-soft:#28563d;--lime:#d8ff55;--sage:#e2ecd8;--muted:#69756d;--line:#17231c22;--white:#fffefa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer;transition:transform .18s,box-shadow .18s}button:hover{transform:translateY(-1px)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8ba85a;outline-offset:3px}.wrap{max-width:1180px;margin:auto;padding:24px 28px 50px}header{display:flex;justify-content:space-between;align-items:center;padding:12px 0 21px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:18px;letter-spacing:-.5px}.brandMark{width:42px;height:42px;border-radius:14px;background:var(--forest);display:grid;place-items:center;color:var(--lime)}.brandMark svg{width:27px;height:27px}.brand small{display:block;font-size:9px;color:var(--muted);letter-spacing:1.5px;margin-top:4px}.muted{color:var(--muted);line-height:1.6}.login{max-width:450px;margin:9vh auto;background:var(--white);border:1px solid #17231c1c;padding:36px;border-radius:24px;box-shadow:0 16px 50px #17231c0c}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.8px;color:var(--forest-soft)}h1{font-size:clamp(36px,6vw,48px);letter-spacing:-2.5px;line-height:1;margin:15px 0}.login p{margin:15px 0 25px}label{display:grid;gap:8px;margin:17px 0;font-size:12px;font-weight:750}input,select{padding:14px 15px;border:1px solid #ccd4cd;border-radius:12px;background:white;color:var(--ink)}.primary{border:0;background:var(--forest);color:white;padding:13px 18px;border-radius:999px;font-weight:800}.lime{background:var(--lime);color:var(--forest)}.full{width:100%}#dashboard{display:none}.top{display:flex;justify-content:space-between;align-items:end;margin:35px 0 24px}.top h1{margin-bottom:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.stat{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px}.stat b{font-size:34px;display:block;color:var(--forest);letter-spacing:-1px}.stat span{font-size:12px;color:var(--muted)}.tools{display:flex;gap:10px;margin:18px 0}.tools input{flex:1;min-width:0}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px}.item img{width:100px;height:82px;object-fit:cover;border-radius:12px;background:#ddd}.item h3{margin:0 0 7px;font-size:18px;letter-spacing:-.3px}.meta{font-size:11px;color:var(--muted);line-height:1.5}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actions button{border:1px solid #ccd4cd;background:var(--paper);padding:10px 12px;border-radius:999px;font-weight:750;font-size:11px}.actions .danger{color:#a51d2d;border-color:#efc3c8;background:#fff8f8}.badge{display:inline-block;padding:6px 10px;border-radius:99px;background:var(--sage);color:#294a35;font-size:10px;font-weight:800;margin-top:8px}#msg{margin-top:12px;color:#a51d2d;font-size:13px;line-height:1.5}@media(max-width:700px){.wrap{padding:16px 16px 35px}.login{margin:8vh auto;padding:26px 22px}.stats{grid-template-columns:1fr 1fr}.item{grid-template-columns:72px minmax(0,1fr);gap:12px}.item img{width:72px;height:72px}.actions{grid-column:1/-1;justify-content:stretch}.actions button{flex:1}.tools{flex-direction:column}.top{align-items:start}}
</style></head><body><div class="wrap">
<header><div class="brand"><span class="brandMark" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none"><path d="M17 20a20 20 0 0 1 32 4" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="m46 14 3 10-10-1" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 44a20 20 0 0 1-32-4" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="m18 50-3-10 10 1" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M31 22c-8 1-12 7-11 14 6 1 12-2 14-8 1 6 5 8 10 8 1-7-4-14-13-14Z" fill="currentColor"/></svg></span><span>MCC ReLoop<small>ADMIN CONSOLE</small></span></div><button id="signout" class="primary" style="display:none">Sign out</button></header>
<section id="login" class="login"><div class="eyebrow">ADMIN ACCESS</div><h1>Manage ReLoop.</h1><p class="muted">Review listings and keep the MCC reuse board in good shape.</p><form id="loginForm"><label>Admin password<input id="password" type="password" autocomplete="current-password" required></label><button class="primary lime full">Sign in</button><div id="msg"></div></form></section>
<section id="dashboard"><div class="top"><div><div class="eyebrow">ADMIN DASHBOARD</div><h1>Listings</h1></div></div><div class="stats"><div class="stat"><b id="total">0</b><span>Total listings</span></div><div class="stat"><b id="available">0</b><span>Available</span></div><div class="stat"><b id="unavailable">0</b><span>Unavailable</span></div></div><div class="tools"><input id="search" placeholder="Search listings..."><select id="filter"><option>All</option><option value="available">Available</option><option value="unavailable">Unavailable</option></select></div><div id="list" class="list"></div></section>
</div><script>
const URL="https://tyenxtzigwdtuyuueukz.supabase.co";
const KEY="sb_publishable_tmXP9uW_woc6fmNf1E_SBQ_Sp5x8Vn5";
const $=s=>document.querySelector(s);
let items=[], token=sessionStorage.getItem("mcc_admin_token")||"";
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function headers(auth=true){let h={apikey:KEY,"Content-Type":"application/json"};if(auth&&token)h.Authorization="Bearer "+token;return h}
function isApprovedAdmin(user){return user?.app_metadata?.role==="admin"}
function show(ok){$("#login").style.display=ok?"none":"block";$("#dashboard").style.display=ok?"block":"none";$("#signout").style.display=ok?"block":"none";if(ok)load()}
async function validate(){if(!token)return show(false);try{let r=await fetch(URL+"/auth/v1/user",{headers:headers()});let u=await r.json();if(r.ok&&isApprovedAdmin(u))show(true);else logout()}catch(e){$("#msg").textContent="Could not connect to Supabase: "+e.message;show(false)}}
$("#loginForm").addEventListener("submit",async e=>{e.preventDefault();const msg=$("#msg"),btn=e.submitter;msg.textContent="Signing in...";btn.disabled=true;try{let r=await fetch(URL+"/functions/v1/admin-login",{method:"POST",headers:headers(false),body:JSON.stringify({password:$("#password").value})});let d=await r.json();if(!r.ok)throw new Error(d.error||d.message||"Sign in failed");if(!d.access_token||!isApprovedAdmin(d.user))throw new Error("This account is not approved for admin access.");token=d.access_token;sessionStorage.setItem("mcc_admin_token",token);$("#password").value="";msg.textContent="";show(true)}catch(err){msg.textContent=err.message}finally{btn.disabled=false}});
function logout(){token="";sessionStorage.removeItem("mcc_admin_token");show(false)}$("#signout").onclick=logout;
async function api(path,opts={}){let r=await fetch(URL+"/rest/v1/"+path,{...opts,headers:{...headers(),...(opts.headers||{})}});if(!r.ok){let d=await r.json().catch(()=>({}));throw new Error(d.message||d.msg||"Request failed")}return r.status===204?null:r.json()}
async function load(){try{items=await api("items?select=*&order=created_at.desc");render()}catch(e){$("#list").textContent=e.message}}
function render(){let q=$("#search").value.toLowerCase(),f=$("#filter").value;let shown=items.filter(i=>(f==="All"||i.status===f)&&(`${i.name} ${i.category} ${i.location}`.toLowerCase().includes(q)));$("#total").textContent=items.length;$("#available").textContent=items.filter(i=>i.status==="available").length;$("#unavailable").textContent=items.filter(i=>i.status==="unavailable").length;$("#list").innerHTML=shown.length?shown.map(i=>`<article class="item"><img src="${esc(i.image_url)}" alt=""><div><h3>${esc(i.name)}</h3><div class="meta">${esc(i.category)} · ${esc(i.location)} · ${new Date(i.created_at).toLocaleDateString()}</div><span class="badge">${esc(i.status)}</span></div><div class="actions"><button onclick="toggleStatus(${i.id},'${i.status}')">${i.status==="available"?"Mark unavailable":"Make available"}</button><button class="danger" onclick="removeItem(${i.id})">Delete</button></div></article>`).join(""):"<p class='muted'>No listings found.</p>"}
$("#search").oninput=render;$("#filter").onchange=render;
async function toggleStatus(id,status){try{await api("items?id=eq."+id,{method:"PATCH",headers:{Prefer:"return=minimal"},body:JSON.stringify({status:status==="available"?"unavailable":"available"})});load()}catch(e){alert(e.message)}}
async function removeItem(id){let i=items.find(x=>x.id===id);if(!i||!confirm(`Permanently delete "${i.name}"?`))return;try{await api("items?id=eq."+id,{method:"DELETE",headers:{Prefer:"return=minimal"}});load()}catch(e){alert(e.message)}}
validate();
</script></body></html>
